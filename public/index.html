<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Note</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Quick Note 📝</h1>
        <p>Write your thoughts quickly.</p>
    </header>

    <main>

        <section class="form-section">

            <h2>Create Note</h2>

            <form id="noteForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Enter note title"
                    required
                >

                <textarea
                    id="content"
                    placeholder="Write your note..."
                    rows="5"
                    required
                ></textarea>

                <button type="submit">
                    Add Note
                </button>

            </form>

            <p id="message"></p>

        </section>


        <section>

            <div class="notes-heading">
                <h2>Your Notes</h2>
                <span id="noteCount">0 notes</span>
            </div>

            <div id="notesContainer"></div>

            <div id="emptyState">
                <h3>No notes yet 📝</h3>
                <p>Create your first note.</p>
            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
